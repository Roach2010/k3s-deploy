---
# The kubeconfig comes from module_defaults in playbooks/applications/emby.yml.

# "always" keeps this check in place when running with --tags emby_storage.
- name: Validate Emby settings
  tags: [always]
  ansible.builtin.assert:
    that:
      - emby_service_ip | default('') is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - emby_version | length > 0
      - emby_version != 'latest'
      - emby_uid | string is match('^[0-9]+$')
      - emby_gid | string is match('^[0-9]+$')
      - emby_media_claim | length > 0
      - emby_media_nfs_server | length > 0
      - emby_media_nfs_share is match('^/')
    fail_msg: >-
      Set emby_service_ip (reserved LAN IPv4) in inventory/group_vars/all/vault.yml,
      a pinned emby_version, numeric emby_uid/emby_gid with access to the media
      export, emby_media_claim and emby_media_nfs_share (exported media directory),
      and make synology_csi_dsm_host or emby_media_nfs_server available.

- name: Inspect eligible Emby workers
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    label_selectors:
      - "!node-role.kubernetes.io/control-plane"
  register: emby_workers

- name: Require at least one eligible worker
  ansible.builtin.assert:
    that:
      - emby_workers.resources | length > 0
    fail_msg: Emby requires a worker on the service IP LAN. Use at least two for rescheduling between workers.

- name: Inspect MetalLB installation
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: metallb-system
    name: metallb-controller
  register: emby_metallb

- name: Require MetalLB cluster bootstrap
  ansible.builtin.assert:
    that:
      - emby_metallb.resources | length == 1
    fail_msg: Run bootstrap-cluster.yml --tags metallb before deploying Emby.

- name: Prepare Emby storage
  tags: [emby_storage]
  block:
    - name: Inspect Emby config StorageClass
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: "{{ emby_config_storage_class }}"
      register: emby_storage_class

    - name: Require Synology iSCSI storage
      ansible.builtin.assert:
        that:
          - emby_storage_class.resources | length == 1
          - emby_storage_class.resources[0].provisioner == 'csi.san.synology.com'
          - emby_storage_class.resources[0].parameters.protocol | default('iscsi') == 'iscsi'
        fail_msg: Run Synology CSI cluster bootstrap before preparing Emby storage.

    - name: Verify NFS CSI is installed
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: CSIDriver
        name: nfs.csi.k8s.io
      register: emby_nfs_driver

    - name: Require the NFS CSI driver
      ansible.builtin.assert:
        that:
          - emby_nfs_driver.resources | length == 1
        fail_msg: Run the nfs_csi role in cluster bootstrap first.

    - name: Create Emby namespace
      kubernetes.core.k8s:
        apply: true
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ emby_namespace }}"

    # A Retain volume keeps the UID of its deleted claim, so a new claim cannot
    # bind to it. Clear that reference on the volumes this role binds by name.
    - name: Inspect the retained volumes
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolume
        name: "{{ item }}"
      loop: "{{ [emby_media_pv] + ([emby_config_pv] if emby_config_pv | length > 0 else []) }}"
      register: emby_retained

    - name: Require the pinned config volume to exist
      ansible.builtin.assert:
        that:
          - (emby_retained.results | selectattr('item', 'eq', emby_config_pv) | first).resources | length == 1
        fail_msg: >-
          Volume {{ emby_config_pv }} (emby_config_pv) does not exist. It holds your Emby
          settings, so the role will not provision a new one. Fix the name, or clear
          emby_config_pv to start with fresh settings.
      when: emby_config_pv | length > 0

    - name: Require the retained volumes to belong to Emby
      vars:
        claim: "{{ emby_config_claim if item.item == emby_config_pv else emby_media_claim }}"
        ref: "{{ item.resources[0].spec.claimRef | default({}) }}"
      ansible.builtin.assert:
        that:
          - ref.name | default(claim) == claim
          - ref.namespace | default(emby_namespace) == emby_namespace
        fail_msg: >-
          Volume {{ item.item }} is reserved for {{ ref.namespace | default('?') }}/{{ ref.name | default('?') }},
          not {{ emby_namespace }}/{{ claim }}. Check emby_config_pv.
      loop: "{{ emby_retained.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.resources | length == 1

    - name: Reattach released volumes to their claims
      vars:
        claim: "{{ emby_config_claim if item.item == emby_config_pv else emby_media_claim }}"
      kubernetes.core.k8s_json_patch:
        api_version: v1
        kind: PersistentVolume
        name: "{{ item.item }}"
        patch:
          - op: add
            path: /spec/claimRef
            value:
              namespace: "{{ emby_namespace }}"
              name: "{{ claim }}"
      loop: "{{ emby_retained.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.resources | length == 1 and item.resources[0].status.phase == 'Released'

    - name: Create static NFS media PV and PVC
      kubernetes.core.k8s:
        apply: true
        template: media.yml.j2

    - name: Create Emby iSCSI config claim
      kubernetes.core.k8s:
        apply: true
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ emby_config_claim }}"
            namespace: "{{ emby_namespace }}"
          spec:
            accessModes: [ReadWriteOnce]
            volumeMode: Filesystem
            storageClassName: "{{ emby_config_storage_class }}"
            volumeName: "{{ emby_config_pv }}"
            resources:
              requests:
                storage: "{{ emby_config_storage_size }}"

# Fails the task when the claim is not Bound within emby_wait_timeout.
- name: Wait for the Emby media claim to bind
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ emby_namespace }}"
    name: "{{ emby_media_claim }}"
  register: emby_media_pvc
  until:
    - emby_media_pvc.resources | length == 1
    - emby_media_pvc.resources[0].status.phase | default('') == 'Bound'
  retries: "{{ emby_wait_retries }}"
  delay: "{{ emby_wait_delay }}"
  when: not ansible_check_mode

- name: Configure Emby address advertisement and certificate
  kubernetes.core.k8s:
    apply: true
    template: network.yml.j2
  register: emby_network
  until: emby_network is succeeded
  retries: 12
  delay: 5

# The pod cannot start until cert-manager issues the emby-tls secret, so this
# wait covers certificate issuance and the current StatefulSet revision.
- name: Apply Emby StatefulSet, services and HTTPS proxy
  kubernetes.core.k8s:
    apply: true
    template: resources.yml.j2
    wait: true
    wait_timeout: "{{ emby_wait_timeout }}"

# Without this the storage class may delete the volume, and your Emby settings,
# when its claim is deleted. Redeploys then find the volume and reattach it.
- name: Look up the bound config volume
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ emby_namespace }}"
    name: "{{ emby_config_claim }}"
  register: emby_config_bound
  when: not ansible_check_mode

- name: Keep the config volume when its claim is deleted
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: "{{ emby_config_bound.resources[0].spec.volumeName }}"
      spec:
        persistentVolumeReclaimPolicy: Retain
  when: not ansible_check_mode

- name: Show the config volume to pin
  ansible.builtin.debug:
    msg: >-
      Pin your Emby settings so redeploys always reattach them: set
      emby_config_pv to "{{ emby_config_bound.resources[0].spec.volumeName }}".
  when: not ansible_check_mode and emby_config_pv | length == 0

# The collection only waits for the Service to exist, not for its address.
- name: Wait for Emby service IP allocation
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: emby
    namespace: "{{ emby_namespace }}"
  register: emby_service
  until:
    - emby_service.resources | length == 1
    - emby_service_ip in (emby_service.resources[0].status.loadBalancer.ingress | default([]) | map(attribute='ip') | list)
  retries: "{{ emby_wait_retries }}"
  delay: "{{ emby_wait_delay }}"
  when: not ansible_check_mode
