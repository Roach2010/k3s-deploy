---
- name: Bootstrap K3s cluster applications
  hosts: localhost
  connection: local
  gather_facts: false

  roles:
    - role: metallb
      tags: [metallb]

    - role: traefik
      tags: [traefik]

    - role: synology_csi
      tags:
        - synology_csi

    - role: nfs_csi
      tags:
        - nfs_csi

    - cert_manager
    - cloudflare
    - cluster_issuer
